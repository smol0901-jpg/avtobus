<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Рейзино Транзит — расписание автобусов</title>
<meta name="description" content="Офлайн-расписание автобусов: Большое Рейзино ↔ Гатчина. Сколько ждать ближайший рейс — сразу на экране.">
<meta name="theme-color" content="#1f5fa8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1722" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Рейзино Транзит">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<noscript><p style="padding:24px;text-align:center">Для работы приложения нужен JavaScript.</p></noscript>

<header class="top">
  <div class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"><b>Рейзино Транзит</b></div>
  <span id="net" class="pill"></span>
</header>

<main id="view" aria-live="polite"></main>

<nav class="tabbar" aria-label="Разделы">
  <button data-tab="sched" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 10h16"/><circle cx="8.5" cy="14" r=".6" fill="currentColor"/><circle cx="15.5" cy="14" r=".6" fill="currentColor"/><path d="M7 17v2M17 17v2"/>
    </svg>Рейсы
  </button>
  <button data-tab="routes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/>
    </svg>Маршруты
  </button>
  <button data-tab="profile">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>
    </svg>Профиль
  </button>
  <button data-tab="about">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.5" r=".6" fill="currentColor"/>
    </svg>О проекте
  </button>
</nav>

<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept="application/json,.json" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
